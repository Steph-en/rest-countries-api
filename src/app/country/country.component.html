<a [routerLink]="['/details', interfaceForm.names.common]">
    <div class="cards">
        <div class="country-card">
            <figure>
                <img class="flag" [style.background-image]="'url(' + interfaceForm.flag?.url_svg + ')'" alt="Flag of {{interfaceForm.names.common}}">
            </figure>
            <div class="info">
                <h2 class="country">{{ interfaceForm.names.common }}</h2>
                <p class="population">Population: {{ interfaceForm.population }}</p>
                <p class="region">Region: {{ interfaceForm.region }}</p>
                <p class="capital">Capital: {{ interfaceForm.capitals?.[0]?.name ?? 'N/A' }}</p>
            </div>
        </div>
    </div>
</a>
